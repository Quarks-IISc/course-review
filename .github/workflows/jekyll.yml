name: Build and Deploy Jekyll

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
        with:
          # Auto-creates the Pages site via the API if it hasn't been
          # initialized yet (fixes "Get Pages site failed... Not Found"
          # on a repo where Pages was just toggled on in Settings).
          enablement: true

      - name: Build with Jekyll
        # Fixed baseurl, not steps.pages.outputs.base_path: this site is
        # reverse-proxied to quarks.ug.iisc.ac.in/course-review/, which
        # doesn't necessarily match this repo's own GitHub Pages project
        # path. This also has to stay in sync with the redirectUri
        # registered in Entra (see auth.js).
        run: bundle exec jekyll build --baseurl "/course-review"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
