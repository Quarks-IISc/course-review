<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarks Course Reviews</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Quarks Course Reviews</h1>

    <button id="loginBtn">
        Sign in with your IISc account (only for students)
    </button>

    <pre id="output">
Not signed in.
    </pre>

    <script type="module" src="app.js"></script>

    <div id="status">
        Checking authentication...
    </div>


    <div id="protected-content" hidden>

        <h2>Course Reviews</h2>

        <div id="filters">
            <!--
            <input
                id="courseSearch"
                type="text"
                placeholder="Search courses..."
            >
            -->

            <label for="courseSelect">Course</label>
            <select id="courseSelect">
                <option value="">All Courses</option>
            </select>

            <input
                id="professorSearch"
                type="text"
                placeholder="Search professors..."
            >
            <!--
            <label for="professorSelect">Professor</label>
            <select id="professorSelect">
                <option value="">All Professors</option>
            </select>
            -->

            <button id="loadReviewsBtn">
                Load Reviews
            </button>

        </div>

        <hr>

        <div id="reviews">

        </div>

    </div>
</body>
</html>
