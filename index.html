<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quarks — Course Reviews</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="header-inner">
            <a href="#" class="brand">QUARKS</a>

            <div class="header-label">
                COURSE REVIEWS
            </div>
        </div>
    </header>


    <main>

        <section class="hero">
            <h1>
                Course Reviews
            </h1>

            <div id="status" class="status">
                Checking authentication...
            </div>

            <button id="loginBtn" class="login-button">
                Sign in with your IISc account
            </button>
        </section>


        <section id="protected-content" class="review-section" hidden>

            <div class="section-heading">
                <p class="eyebrow">Student Reviews</p>

                <h2>
                    Find a course
                </h2>

                <p>
                    Search by course or professor.
                </p>
            </div>


            <div id="filters" class="filters">

                <!-- COURSE AUTOCOMPLETE -->

                <div class="autocomplete-group">

                    <label for="courseSearch">
                        Course
                    </label>

                    <div class="autocomplete">
                        <input
                            id="courseSearch"
                            type="text"
                            placeholder="Search for a course..."
                            autocomplete="off"
                            spellcheck="false"
                        >

                        <div
                            id="courseSuggestions"
                            class="suggestions"
                            hidden
                        ></div>
                    </div>

                    <input
                        id="courseSelect"
                        type="hidden"
                        value=""
                    >

                </div>


                <!-- PROFESSOR AUTOCOMPLETE -->

                <div class="autocomplete-group">

                    <label for="professorSearch">
                        Professor
                    </label>

                    <div class="autocomplete">

                        <input
                            id="professorSearch"
                            type="text"
                            placeholder="Search for a professor..."
                            autocomplete="off"
                            spellcheck="false"
                        >

                        <div
                            id="professorSuggestions"
                            class="suggestions"
                            hidden
                        ></div>

                    </div>

                    <input
                        id="professorSelect"
                        type="hidden"
                        value=""
                    >

                </div>


                <button id="loadReviewsBtn" class="load-button">
                    View Reviews
                    <span>→</span>
                </button>

            </div>


            <div class="divider"></div>


            <section class="reviews-section">

                <div class="reviews-heading">
                    <h2>Reviews</h2>
                </div>

                <div id="reviews"></div>

            </section>

        </section>

    </main>


    <footer>
        <span>QUARKS</span>
        <span>IISc Undergraduate Magazine</span>
    </footer>


    <script type="module" src="app.js"></script>

</body>
</html>
