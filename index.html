<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarks Course Reviews</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Quarks Course Reviews</h1>

    <button id="loginBtn">
        Sign in with your IISc account (only for students)
    </button>

    <pre id="output">
Not signed in.
    </pre>

    <script type="module" src="app.js"></script>

    <div id="status">
        Checking authentication...
    </div>


    <div id="protected-content" hidden>

        <h2>Course Reviews</h2>

        <div id="filters">

            <label for="courseSearch">Course</label>
            <div class="autocomplete">
                <input
                    id="courseSearch"
                    type="text"
                    placeholder="Search for a course..."
                >
                <div id="courseSuggestions"></div>  
            </div>

            <input
                id="courseSelect"
                type="hidden"
                value=""
            >
            
            <label for="professorSearch">Professor</label>
            <div class="autocomplete">

                <input
                    id="professorSearch"
                    type="text"
                    placeholder="Search for a professor..."
                >

                <div id="professorSuggestions"></div>

            </div>

            <input
                id="professorSelect"
                type="hidden"
                value=""
            >

            <button id="loadReviewsBtn">
                Load Reviews
            </button>

        </div>

        <hr>

        <div id="reviews">

        </div>

    </div>
</body>
</html>
