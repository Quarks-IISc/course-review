---
layout: default
title: "Course Reviews"
permalink: /
---

<section class="recent-posts">

  <div class="section-title section-hero-header">
    <h2><span>Course Reviews</span></h2>
  </div>

  <p class="club-dek">Real reviews from IISc students, gated to IISc accounts only.</p>

  <div id="login-panel" class="panel">
    <button id="loginBtn">
      <i class="fas fa-shield-alt"></i>
      Sign in with your IISc account
    </button>
    <p class="login-note">Only students with an IISc Microsoft account can access reviews.</p>
  </div>

  <pre id="output"></pre>

  <div id="status"></div>

  <div id="protected-content" hidden>

    <div id="filters" class="panel">

      <label for="courseSearch">Course</label>
      <div class="autocomplete">
        <input
          id="courseSearch"
          type="text"
          placeholder="Search for a course..."
          autocomplete="off"
        >
        <div id="courseSuggestions"></div>
      </div>

      <input id="courseSelect" type="hidden" value="">

      <label for="professorSearch">Professor</label>
      <div class="autocomplete">
        <input
          id="professorSearch"
          type="text"
          placeholder="Search for a professor..."
          autocomplete="off"
        >
        <div id="professorSuggestions"></div>
      </div>

      <input id="professorSelect" type="hidden" value="">

      <button id="loadReviewsBtn">Load Reviews</button>

    </div>

    <div id="reviews"></div>

  </div>

</section>

<script type="module" src="{{ site.baseurl }}/app.js"></script>
<script>
  // app.js only toggles `hidden` on #protected-content, with no class hook,
  // so hide the sign-in panel ourselves once it's unhidden.
  document.addEventListener('DOMContentLoaded', () => {
    const loginPanel = document.getElementById('login-panel');
    const protectedContent = document.getElementById('protected-content');
    new MutationObserver(() => {
      loginPanel.hidden = !protectedContent.hidden;
    }).observe(protectedContent, { attributes: true, attributeFilter: ['hidden'] });
  });
</script>
