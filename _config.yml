# Site
name: "Quarks Course Reviews"
title: "Course Reviews"
description: "IISc student course & professor reviews, restricted to IISc accounts."
baseurl: "/course-review"
url: "https://quarks.ug.iisc.ac.in"

# Where the main Quarks blog lives, used for the nav/footer's cross-links
# and for pulling shared CSS/JS assets live from the blog itself.
quarks_url: "https://quarks.ug.iisc.ac.in"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - LICENSE
  - README.md
  - vendor

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
